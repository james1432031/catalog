<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κατάλογος Προϊόντων</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        img {
            -webkit-user-select: none;
            user-select: none;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col" oncontextmenu="return false;">

    <!-- Header / Top Bar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-boxes-stacked text-2xl text-blue-400"></i>
                <h1 class="text-xl font-bold tracking-wide">Κατάλογος Προϊόντων</h1>
                <span id="total-count" class="bg-blue-600 text-xs px-2.5 py-1 rounded-full font-medium">0 Προϊόντα</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Controls & Filters -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400"></i>
                <input type="text" id="search-input" oninput="debounceFilter()" placeholder="Αναζήτηση τίτλου, SKU, barcode..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <!-- Category Filter -->
                <select id="category-filter" onchange="filterProducts()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Όλες οι Κατηγορίες</option>
                </select>

                <!-- Color Filter -->
                <select id="color-filter" onchange="filterProducts()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Όλα τα Χρώματα</option>
                </select>

                <!-- Size Filter -->
                <select id="size-filter" onchange="filterProducts()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Όλα τα Μεγέθη</option>
                </select>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-3"></i>
            <p id="loading-text" class="text-slate-500 font-medium">Φόρτωση προϊόντων...</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fa-solid fa-box-open text-5xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">Δεν βρέθηκαν προϊόντα.</p>
        </div>

        <!-- Pagination -->
        <div id="pagination-container" class="hidden items-center justify-between mt-8 bg-white px-4 py-3 rounded-xl border border-slate-200 shadow-sm">
            <button onclick="changePage(-1)" id="prev-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium disabled:opacity-50 transition">Προηγούμενη</button>
            <span id="page-info" class="text-sm text-slate-600 font-medium">Σελίδα 1 από 1</span>
            <button onclick="changePage(1)" id="next-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium disabled:opacity-50 transition">Επόμενη</button>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col relative">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800 truncate pr-4"></h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <div class="aspect-square bg-slate-100 rounded-xl overflow-hidden mb-3 border border-slate-200 flex items-center justify-center relative group cursor-pointer" onclick="openLightbox()">
                        <img id="modal-main-image" src="" alt="" class="w-full h-full object-contain">
                        <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-sm font-medium gap-2">
                            <i class="fa-solid fa-expand"></i> Μεγέθυνση
                        </div>
                    </div>
                    <div id="modal-thumbnails" class="grid grid-cols-4 gap-2"></div>
                </div>
                <div class="flex flex-col justify-between">
                    <div>
                        <div class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-1" id="modal-category"></div>
                        <div class="text-xs text-slate-400 mb-3">SKU: <span id="modal-sku"></span> | Barcode: <span id="modal-barcode"></span></div>
                        
                        <!-- Χρώμα και Μέγεθος στο Modal -->
                        <div id="modal-attributes" class="flex flex-wrap gap-2 mb-4"></div>

                        <div class="text-2xl font-bold text-slate-900 mb-4" id="modal-price"></div>

                        <div class="text-sm text-slate-600 leading-relaxed space-y-2 max-h-50 overflow-y-auto pr-2" id="modal-description"></div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100">
                        <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl font-medium transition">Κλείσιμο</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white text-3xl hover:text-red-400 z-50 w-14 h-14 bg-black/70 hover:bg-black rounded-full flex items-center justify-center transition border border-white/20 cursor-pointer shadow-lg">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button onclick="prevLightboxImage()" class="absolute left-6 text-white text-xl z-50 w-12 h-12 bg-black/70 hover:bg-black rounded-full flex items-center justify-center transition border border-white/20 shadow-lg cursor-pointer">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <img id="lightbox-img" class="max-w-[85vw] max-h-[85vh] object-contain select-none" draggable="false">
        <button onclick="nextLightboxImage()" class="absolute right-6 text-white text-xl z-50 w-12 h-12 bg-black/70 hover:bg-black rounded-full flex items-center justify-center transition border border-white/20 shadow-lg cursor-pointer">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div id="lightbox-counter" class="absolute bottom-6 text-white/90 text-sm tracking-widest font-medium bg-black/70 px-4 py-1.5 rounded-full border border-white/10 shadow-lg"></div>
    </div>

    <!-- Φόρτωση δεδομένων -->
    <script src="products.js"></script>
    <script>
        let filteredProducts = [];
        let currentPage = 1;
        const pageSize = 24;
        let searchTimeout = null;

        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loading-spinner').classList.add('hidden');
            if (typeof window.allProducts !== 'undefined' && window.allProducts.length > 0) {
                initFilters();
                filterProducts();
            } else {
                alert("Σφάλμα: Δεν βρέθηκαν προϊόντα στο products.js");
            }
        });

        // Βοηθητική συνάρτηση για ενιαίο μέγεθος (από dress_size, shoe_size ή material_thickness)
        function getProductSize(p) {
            return p.dress_size || p.shoe_size || p.material_thickness || '';
        }

        function initFilters() {
            const categoriesSet = new Set();
            const colorsSet = new Set();
            const sizesSet = new Set();

            window.allProducts.forEach(p => {
                if (p.category) categoriesSet.add(p.category.trim());
                if (p.main_color) colorsSet.add(p.main_color.trim());
                const size = getProductSize(p);
                if (size) sizesSet.add(size.trim());
            });
            
            // Γέμισμα Κατηγοριών
            const catSelect = document.getElementById('category-filter');
            catSelect.innerHTML = '<option value="">Όλες οι Κατηγορίες</option>';
            Array.from(categoriesSet).sort().forEach(cat => {
                catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });

            // Γέμισμα Χρωμάτων
            const colorSelect = document.getElementById('color-filter');
            colorSelect.innerHTML = '<option value="">Όλα τα Χρώματα</option>';
            Array.from(colorsSet).sort().forEach(color => {
                colorSelect.innerHTML += `<option value="${color}">${color}</option>`;
            });

            // Γέμισμα Μεγεθών
            const sizeSelect = document.getElementById('size-filter');
            sizeSelect.innerHTML = '<option value="">Όλα τα Μεγέθη</option>';
            Array.from(sizesSet).sort().forEach(size => {
                sizeSelect.innerHTML += `<option value="${size}">${size}</option>`;
            });
        }

        function debounceFilter() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                filterProducts();
            }, 300);
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedCat = document.getElementById('category-filter').value;
            const selectedColor = document.getElementById('color-filter').value;
            const selectedSize = document.getElementById('size-filter').value;

            filteredProducts = window.allProducts.filter(p => {
                const title = (p.title_EN || '').toLowerCase();
                const sku = (p.product_id || '').toLowerCase();
                const barcode = (p.barcode || '').toLowerCase();
                const keyword = (p.product_keyword || '').toLowerCase();
                const cat = (p.category || '').trim();
                const color = (p.main_color || '').trim();
                const size = getProductSize(p).trim();

                const matchesQuery = !query || title.includes(query) || sku.includes(query) || barcode.includes(query) || keyword.includes(query);
                const matchesCat = !selectedCat || cat === selectedCat;
                const matchesColor = !selectedColor || color === selectedColor;
                const matchesSize = !selectedSize || size === selectedSize;

                return matchesQuery && matchesCat && matchesColor && matchesSize;
            });

            document.getElementById('total-count').innerText = `${filteredProducts.length} Προϊόντα`;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const grid = document.getElementById('product-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (filteredProducts.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('pagination-container').classList.add('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
                document.getElementById('pagination-container').classList.remove('hidden');
            }

            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageItems = filteredProducts.slice(start, end);

            let htmlContent = '';
            pageItems.forEach((p, index) => {
                const img = p.product_image_1 || 'https://via.placeholder.com/300?text=No+Image';
                const price = parseFloat(p.recommended_selling_price || 0).toFixed(2);
                const globalIndex = start + index;
                const color = p.main_color ? `<span class="bg-slate-100 text-slate-700 text-[10px] px-2 py-0.5 rounded">Χρώμα: ${p.main_color}</span>` : '';
                const sizeVal = getProductSize(p);
                const size = sizeVal ? `<span class="bg-slate-100 text-slate-700 text-[10px] px-2 py-0.5 rounded">Μέγεθος: ${sizeVal}</span>` : '';

                htmlContent += `
                    <div onclick="openModalByIndex(${globalIndex})" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between cursor-pointer group">
                        <div class="aspect-square bg-slate-100 overflow-hidden relative">
                            <img src="${img}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 pointer-events-none" loading="lazy">
                            <span class="absolute top-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm">${p.product_id || ''}</span>
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <div>
                                <span class="text-[11px] font-semibold text-blue-600 uppercase tracking-wide block mb-1">${p.category || ''}</span>
                                <h4 class="font-medium text-slate-800 text-sm line-clamp-2 mb-2">${p.title_EN || 'Χωρίς Τίτλο'}</h4>
                                <div class="flex flex-wrap gap-1 mb-2">${color} ${size}</div>
                            </div>
                            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-100">
                                <span class="text-lg font-bold text-slate-900">${price} €</span>
                                <span class="text-xs text-blue-600 font-medium group-hover:underline">Λεπτομέρειες <i class="fa-solid fa-arrow-right ml-1"></i></span>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = htmlContent;
            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredProducts.length / pageSize) || 1;
            document.getElementById('page-info').innerText = `Σελίδα ${currentPage} από ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredProducts.length / pageSize);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openModalByIndex(index) {
            const p = filteredProducts[index];
            if(!p) return;

            document.getElementById('modal-title').innerText = p.title_EN || '';
            document.getElementById('modal-category').innerText = p.category || '';
            document.getElementById('modal-sku').innerText = p.product_id || '-';
            document.getElementById('modal-barcode').innerText = p.barcode || '-';
            document.getElementById('modal-price').innerText = `${parseFloat(p.recommended_selling_price || 0).toFixed(2)} €`;
            
            // Εμφάνιση χρωμάτων & μεγεθών στο modal
            const attrDiv = document.getElementById('modal-attributes');
            attrDiv.innerHTML = '';
            if (p.main_color) {
                attrDiv.innerHTML += `<span class="bg-blue-50 text-blue-700 border border-blue-200 text-xs px-2.5 py-1 rounded-lg font-medium">Χρώμα: ${p.main_color}</span>`;
            }
            const sizeVal = getProductSize(p);
            if (sizeVal) {
                attrDiv.innerHTML += `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2.5 py-1 rounded-lg font-medium">Μέγεθος: ${sizeVal}</span>`;
            }

            document.getElementById('modal-description').innerHTML = p.full_text_EN || 'Δεν υπάρχει διαθέσιμη περιγραφή.';

            currentLightboxImages = [];
            for (let i = 1; i <= 8; i++) {
                if (p[`product_image_${i}`]) {
                    currentLightboxImages.push(p[`product_image_${i}`]);
                }
            }

            const mainImg = document.getElementById('modal-main-image');
            const thumbsContainer = document.getElementById('modal-thumbnails');
            thumbsContainer.innerHTML = '';

            if (currentLightboxImages.length > 0) {
                mainImg.src = currentLightboxImages[0];
                currentLightboxIndex = 0;

                currentLightboxImages.forEach((imgUrl, idx) => {
                    let thumb = document.createElement('div');
                    thumb.className = `aspect-square rounded-lg border-2 overflow-hidden cursor-pointer transition ${idx === 0 ? 'border-blue-600' : 'border-transparent hover:border-slate-300'}`;
                    thumb.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover pointer-events-none" loading="lazy">`;
                    thumb.onclick = () => {
                        mainImg.src = imgUrl;
                        currentLightboxIndex = idx;
                        Array.from(thumbsContainer.children).forEach(t => t.classList.remove('border-blue-600'));
                        thumb.classList.add('border-blue-600');
                    };
                    thumbsContainer.appendChild(thumb);
                });
            } else {
                mainImg.src = 'https://via.placeholder.com/300?text=No+Image';
            }

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function openLightbox() {
            if (currentLightboxImages.length === 0) return;
            updateLightboxView();
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function nextLightboxImage() {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxImages.length;
            updateLightboxView();
        }

        function prevLightboxImage() {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxImages.length) % currentLightboxImages.length;
            updateLightboxView();
        }

        function updateLightboxView() {
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex];
            document.getElementById('lightbox-counter').innerText = `${currentLightboxIndex + 1} / ${currentLightboxImages.length}`;
        }
    </script>
</body>
</html>
